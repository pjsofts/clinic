<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>پنل درخواست‌ها | دل آسا</title>
  <link rel="icon" href="../logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../" class="brand">
        <img src="../logo.svg" alt="" width="36" height="36">
        <span><strong>دل آسا</strong><small>پنل درخواست‌های تماس</small></span>
      </a>
      <div class="admin-actions" id="admin-actions" hidden>
        <button class="btn btn-ghost btn-sm" id="refresh" type="button">به‌روزرسانی</button>
        <button class="btn btn-ghost btn-sm" id="logout" type="button">خروج</button>
      </div>
    </div>
  </header>

  <main class="container admin">
    <form class="card login" id="login" hidden>
      <h1>ورود به پنل</h1>
      <div class="field">
        <label for="user">نام کاربری</label>
        <input id="user" type="text" autocomplete="username" value="admin" dir="ltr" required>
      </div>
      <div class="field">
        <label for="password">رمز عبور</label>
        <input id="password" type="password" autocomplete="current-password" dir="ltr" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">ورود</button>
      <p class="form-status error" id="login-error" role="alert"></p>
    </form>

    <div id="dashboard" hidden>
      <div class="stats" id="stats"></div>
      <div class="filters" id="status-filters" role="group" aria-label="فیلتر وضعیت"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>تاریخ</th>
              <th>نام</th>
              <th>تلفن</th>
              <th>درمانگر</th>
              <th>جلسه</th>
              <th>زمان</th>
              <th>توضیحات</th>
              <th>وضعیت</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="muted" id="empty" hidden>درخواستی وجود ندارد.</p>
    </div>
  </main>

  <script src="../config.js"></script>
  <script src="admin.js" defer></script>
</body>
</html>
