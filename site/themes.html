<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>انتخاب طرح سایت | دل آسا</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
  <style>
    .gallery-head { padding: 56px 0 24px; text-align: center; }
    .gallery-head h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; }
    .gallery-head p { color: var(--muted); max-width: 40em; margin-inline: auto; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 28px; padding-bottom: 72px; }
    .theme-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
    .theme-card .shot { display: block; aspect-ratio: 16 / 11; overflow: hidden; border-bottom: 1px solid var(--border); background: var(--bg-alt); }
    .theme-card img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform .4s; }
    .theme-card:hover img { transform: scale(1.03); }
    .theme-card .body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .theme-card h2 { font-size: 1.3rem; margin: 0; display: flex; align-items: center; gap: 10px; }
    .theme-card .num { font-size: .85rem; color: var(--muted); font-weight: 500; }
    .theme-card p { color: var(--muted); margin: 0 0 12px; }
    .theme-card .btn { margin-top: auto; }
  </style>
</head>
<body>
  <main class="container">
    <header class="gallery-head">
      <h1>طرح سایت دل آسا را انتخاب کنید</h1>
      <p>
        محتوا و امکانات همه طرح‌ها یکسان است و فقط ظاهر آن‌ها فرق می‌کند. هر طرح را باز کنید و در سایت بگردید؛
        با منوی پایین صفحه می‌توانید بین طرح‌ها جابه‌جا شوید. سپس نام طرح دلخواهتان را به ما اعلام کنید.
      </p>
    </header>
    <div class="gallery" id="gallery"></div>
  </main>

  <script>
    const faDigits = (n) => n.toLocaleString('fa-IR');
    document.getElementById('gallery').replaceChildren(
      ...window.CLINIC_THEMES.map((t, i) => {
        const card = document.createElement('article');
        card.className = 'card theme-card';
        const href = `./?theme=${t.id}`;
        card.innerHTML = `
          <a class="shot" href="${href}"><img src="themes/previews/${t.id}.jpg" alt="" loading="lazy" width="1280" height="880"></a>
          <div class="body">
            <h2><span class="num">طرح ${faDigits(i + 1)}</span></h2>
            <p></p>
            <a class="btn btn-primary" href="${href}">مشاهده این طرح</a>
          </div>`;
        card.querySelector('h2').append(t.name);
        card.querySelector('p').textContent = t.description;
        card.querySelector('img').alt = `پیش‌نمایش طرح ${t.name}`;
        return card;
      }),
    );
  </script>
</body>
</html>
